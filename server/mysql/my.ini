[mysqld]
# ============================================
# Конфигурация MariaDB для портативного бандла СГУВТ
# Production режим
# ============================================

# Порт (стандартный)
port = 3306

# Кодировка
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci

# Безопасность
bind-address = 127.0.0.1
skip-name-resolve

# Производительность
innodb_buffer_pool_size = 128M
max_connections = 100
table_open_cache = 256
thread_cache_size = 8

# Логи
log-error = ../logs/mysql_error.log
slow_query_log = 0
general_log = 0

# Временные файлы
tmpdir = ../logs

[client]
port = 3306
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4
