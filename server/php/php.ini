[PHP]
; ============================================
; Конфигурация PHP для портативного бандла СГУВТ
; Production режим
; ============================================

; --- Расширения ---
extension_dir = "ext"
extension=pdo_mysql
extension=mbstring
extension=mysqli
extension=openssl
extension=curl
extension=zip
extension=fileinfo
extension=gd

; --- Часовой пояс ---
date.timezone = Asia/Novosibirsk

; --- Кодировка ---
default_charset = "UTF-8"

; --- Логи ошибок ---
error_reporting = E_ALL
display_errors = Off
log_errors = On
error_log = "../logs/php_error.log"

; --- Безопасность ---
expose_php = Off

; --- Производительность ---
memory_limit = 256M
max_execution_time = 60
post_max_size = 50M
upload_max_filesize = 50M

; --- Сессии ---
session.save_path = "../logs"
session.gc_maxlifetime = 1440

; --- OPcache ---
opcache.enable = 0
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 1
